<!-- Page Header -->

<div class="page-header flex-shrink-0">

  <div class="d-flex flex-column gap-1">

    <span class="page-title fw-semibold mb-0">
      <i class="bi bi-gear"></i>
      Account Settings
    </span>

    <small class="text-muted">
      Manage your account security and preferences
    </small>

  </div>

</div>


<div class="account-settings-page">

  <!-- Security -->

  <section class="card shadow-sm border-0 profile-card mb-4">

    <div class="card-header bg-transparent border-0 pt-4 px-4">

      <h5 class="mb-1">
        Security
      </h5>

      <small class="text-muted">
        Manage your password and keep your account secure
      </small>

    </div>


    <div class="card-body px-4 pb-4">

      <div class="d-flex flex-column gap-2">

        <!-- Change Password -->

        <button
          type="button"
          class="btn btn-light border d-flex align-items-center text-start p-3"
          (click)="openChangePasswordDialog()"
        >

          <div class="profile-field-icon text-primary flex-shrink-0">
            <i class="bi bi-key"></i>
          </div>

          <div class="ms-3">

            <div class="fw-semibold">
              Change Password
            </div>

            <small class="text-muted">
              Update your password to keep your account secure
            </small>

          </div>

          <i class="bi bi-chevron-right ms-auto text-muted"></i>

        </button>

      </div>

    </div>

  </section>


  <!-- Email -->
  @if(!profile()?.emailConfirmed) {
    <section class="card shadow-sm border-0 profile-card mb-4">

      <div class="card-header bg-transparent border-0 pt-4 px-4">

        <h5 class="mb-1">
          Email
        </h5>

        <small class="text-muted">
          Manage your email address and confirmation status
        </small>

      </div>

      <div class="card-body px-4 pb-4">

        <div class="d-flex flex-column gap-2">

          <!-- Request Email Confirmation -->

          <button
            type="button"
            class="btn btn-light border d-flex align-items-center text-start p-3"
            /* (click)="requestEmailConfirmation()" */
          >

            <div class="profile-field-icon text-primary flex-shrink-0">
              <i class="bi bi-envelope-check"></i>
            </div>

            <div class="ms-3">

              <div class="fw-semibold">
                Confirm Email Address
              </div>

              <small class="text-muted">
                Request a new confirmation link for your email address
              </small>

            </div>

            <i class="bi bi-chevron-right ms-auto text-muted"></i>

          </button>

        </div>

      </div>

    </section>
  }


  <!-- Account -->

  <section class="card shadow-sm border-0 profile-card">

    <div class="card-header bg-transparent border-0 pt-4 px-4">

      <h5 class="mb-1">
        Account
      </h5>

      <small class="text-muted">
        Manage your account and permanently remove your data
      </small>

    </div>


    <div class="card-body px-4 pb-4">

      <div class="d-flex flex-column gap-2">

        <!-- Delete Account -->

        <button
          type="button"
          class="btn btn-light border d-flex align-items-center text-start p-3"
          (click)="confirmDeleteDialog()"
        >

          <div class="profile-field-icon text-danger flex-shrink-0">
            <i class="bi bi-trash3"></i>
          </div>

          <div class="ms-3">

            <div class="fw-semibold text-danger">
              Delete Account
            </div>

            <small class="text-muted">
              Permanently delete your account and all associated data
            </small>

          </div>

          <i class="bi bi-chevron-right ms-auto text-muted"></i>

        </button>

      </div>

    </div>

  </section>

</div>
