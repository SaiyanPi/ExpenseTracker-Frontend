<form id="edit-category-form" [formRoot]="categoryForm" class="px-4 py-3">

  <h2 mat-dialog-title>Edit Category</h2>

  @let validationErrors = serverValidationErrors();

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Category Name</mat-label>

    <input id="name" class="form-control" [formField]="categoryForm.name">
    <!-- server side validation errors in the form field-->
    @if (validationErrors['Name']) {
      @for (message of validationErrors['Name']; track message) {
        <div class="invalid-feedback d-block mt">
          {{ message }}
        </div>
      }
    }

  </mat-form-field>

</form>

<mat-dialog-actions align="end">

  <button matButton mat-dialog-close>Cancel</button>

  <button matButton color="primary" type="submit" form="edit-category-form">Save</button>

</mat-dialog-actions>
