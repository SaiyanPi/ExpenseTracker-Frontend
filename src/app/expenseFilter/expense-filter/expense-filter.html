<!-- Expense Filters -->
<div class="card shadow-sm border-0 mb-4 expense-filter-card">

  <div class="card-body">

    <div class="d-flex justify-content-between align-items-center mb-3">

      @if(fromExport()) {

        <button
          class="btn btn-sm btn-outline-primary"
          type="button"
          (click)="exportRequested.emit()"
          aria-label="Export expenses"
        >
          <i class="bi bi-file-earmark-arrow-down"></i>
          Download
        </button>
          
      } @else {
        
        <button
          class="btn btn-sm btn-outline-secondary"
          type="button"
          (click)="resetFilters()"
        >
          Reset
        </button>

      }

    </div>


    <div class="row g-2">

      <!-- Category -->
      <div class="col-12 col-md-6 col-xl-3">

        <label class="form-label filter-label" for="category">
          Category
        </label>

        <select
          id="category"
          class="form-select form-select-sm"
          [value]="expenseFilters().categoryId() ?? ''"
          (change)="onCategoryChange($event)"
        >
          <option value="">Categories</option>

          @if (categories.hasValue()) {
            @for (category of categories.value().items; track category.id) {
              <option [value]="category.id">
                {{ category.name }}
              </option>
            }
          }

        </select>

      </div>


      <!-- Budget -->
      <div class="col-12 col-md-6 col-xl-3">

        <label class="form-label filter-label" for="budget">
          Budget
        </label>

        <select
          id="budget"
          class="form-select form-select-sm"
          [value]="expenseFilters().budgetId() ?? ''"
          (change)="onBudgetChange($event)"
        >
          <option value="">Budgets</option>

          @if (budgets.hasValue()) {
            @for (budget of budgets.value().items; track budget.id) {
              <option [value]="budget.id">
                {{ budget.name }}
              </option>
            }
          }

        </select>

      </div>


      <!-- Start Date -->
      <div class="col-12 col-md-6 col-xl-3">

        <label class="form-label filter-label" for="startDate">
          From
        </label>

        <input
          id="startDate"
          type="date"
          class="form-control form-control-sm"
          [value]="expenseFilters().startDate() ?? ''"
          (change)="onStartDateChange($event)"
        />

      </div>


      <!-- End Date -->
      <div class="col-12 col-md-6 col-xl-3">

        <label class="form-label filter-label" for="endDate">
          To
        </label>

        <input
          id="endDate"
          type="date"
          class="form-control form-control-sm"
          [value]="expenseFilters().endDate() ?? ''"
          (change)="onEndDateChange($event)"
        />

      </div>


      <!-- Minimum Amount -->
      <div class="col-12 col-md-6 col-xl-3">

        <label class="form-label filter-label" for="minAmount">
          Minimum spent
        </label>

        <input
          id="minAmount"
          type="number"
          class="form-control form-control-sm"
          placeholder="e.g. 100"
          [value]="expenseFilters().minAmount() ?? ''"
          (change)="onMinAmountChange($event)"
        />

      </div>


      <!-- Maximum Amount -->
      <div class="col-12 col-md-6 col-xl-3">

        <label class="form-label filter-label" for="maxAmount">
          Maximum spent
        </label>

        <input
          id="maxAmount"
          type="number"
          class="form-control form-control-sm"
          placeholder="e.g. 50000"
          [value]="expenseFilters().maxAmount() ?? ''"
          (change)="onMaxAmountChange($event)"
        />

      </div>


      @if(fromExport()) {
        <!-- Format -->
        <div class="col-12 col-md-6 col-xl-3">

          <label class="form-label filter-label" for="format">
            Format
          </label>

          <select 
            id="format"
            class="form-select form-select-sm"
            [value]="exportFormat()"
            (change)="onExportFormatChange($event)"
          >
            <option value="pdf">PDF</option>
            <option value="csv">CSV</option>
            <option value="xlsx">XLSX</option>
          </select>

        </div>
      }

    </div>

  </div>

</div>
