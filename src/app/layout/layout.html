<mat-sidenav-container class="sidenav-container">

  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
  >

    <!-- User Account -->
    <button
      type="button"
      class="user-menu-trigger"
      [matMenuTriggerFor]="userMenu"
    >
      <div class="sidenav-header">

        <div class="user-avatar">
          {{ userName()?.charAt(0)?.toUpperCase() }}
        </div>

        <div class="user-info">
          <h2>{{ userName() }}</h2>
          <p class="user-email">{{ userEmail() }}</p>
        </div>

        <mat-icon class="account-arrow">
          expand_more
        </mat-icon>

      </div>
    </button>

    <mat-menu #userMenu="matMenu" class="account-menu">

      <button mat-menu-item routerLink="/app/profile">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>

      <button mat-menu-item routerLink="/app/account-settings">
        <mat-icon>settings</mat-icon>
        <span>Account Settings</span>
      </button>

      <mat-divider></mat-divider>

      <button
        mat-menu-item
        type="button"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>

    </mat-menu>


    <!-- Navigation -->
    <nav>

      <a
        mat-button
        routerLink="/app/dashboard"
        routerLinkActive="active"
      >
        <mat-icon>bar_chart</mat-icon>
        <span>Dashboard</span>
      </a>

      <a
        mat-button
        routerLink="/app/expenses"
        routerLinkActive="active"
      >
        <mat-icon>wallet</mat-icon>
        <span>Expenses</span>
      </a>

      <a
        mat-button
        routerLink="/app/budgets"
        routerLinkActive="active"
      >
        <mat-icon>savings</mat-icon>
        <span>Budgets</span>
      </a>

      <a
        mat-button
        routerLink="/app/categories"
        routerLinkActive="active"
      >
        <mat-icon>sell</mat-icon>
        <span>Categories</span>
      </a>

    </nav>

  </mat-sidenav>


  <mat-sidenav-content>

    @if (isMobile()) {

      <mat-toolbar>

        <button
          mat-icon-button
          class="menu-button"
          (click)="sidenav.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>

        <span class="toolbar-title">
          Expense Tracker
        </span>

      </mat-toolbar>
      
    }

    <main class="content">
      <router-outlet />
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
