<div class="row g-2 align-items-end">

  <div class="col-12 col-md-5">
    <label for="startDate" class="form-label">
      From
    </label>

    <input
      id="startDate"
      type="date"
      class="form-control"
      [value]="dateRangeState().startDate() ?? ''"
      (change)="onStartDateChange($any($event.target).value)"
    />
  </div>

  <div class="col-12 col-md-5">
    <label for="endDate" class="form-label">
      To
    </label>

    <input
      id="endDate"
      type="date"
      class="form-control"
      [value]="dateRangeState().endDate() ?? ''"
      (change)="onEndDateChange($any($event.target).value)"
    />
  </div>

  <!-- @if (errorMessage(); as error) {
    <div class="text-danger small mt-1">
      {{ error }}
    </div>
  } -->

  <div class="col-12 col-md-2">
    <button
      type="button"
      class="btn btn-outline-secondary w-100"
      [disabled]="!dateRangeState().startDate() && !dateRangeState().endDate() || loading()"
      (click)="reset()"
    >
      Clear
    </button>
  </div>

</div>
