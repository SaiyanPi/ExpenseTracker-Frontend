<!-- Pagination controls -->
<div class="pagination-controls">

  <!-- Page size -->
  <select
    id="pageSize"
    class="form-select form-select-sm page-size-select"
    [value]="paginationState().pageSize()"
    (change)="changePageSize($event)"
  >

    @for (size of pageSizeOptions; track size) {

      <option
        [value]="size"
        [selected]="paginationState().pageSize() === size"
      >
        {{ size }} / page
      </option>

    }

  </select>


  <!-- Sorting -->
  <div class="sorting-controls">

    <select
      id="sortBy"
      class="form-select form-select-sm sort-select"
      [value]="paginationState().sortBy() ?? ''"
      (change)="changeSortBy($event)"
    >

      <option
        value=""
        [selected]="paginationState().sortBy() === null"
      >
        Sort by...
      </option>

      @for (option of sortOptions(); track option.value) {

        <option
          [value]="option.value"
          [selected]="paginationState().sortBy() === option.value"
        >
          {{ option.label }}
        </option>

      }

    </select>


    <button
      type="button"
      class="btn btn-outline-secondary btn-sm sort-direction-button"
      [disabled]="paginationState().sortBy() === null"
      (click)="toggleSortDirection()"
      [attr.aria-label]="
        paginationState().sortDesc()
          ? 'Sort descending'
          : 'Sort ascending'
      "
    >
      {{ paginationState().sortDesc() ? '⬇️' : '⬆️' }}
    </button>


    <button
      type="button"
      class="btn btn-outline-info btn-sm reset-button"
      [disabled]="paginationState().sortBy() === null"
      (click)="reset()"
    >
      Reset
    </button>

  </div>

</div>


<!-- Page navigation -->
@if (result(); as result) {

  <div class="page-navigation">

    <button
      type="button"
      class="btn btn-dark btn-sm"
      [disabled]="loading() || !result.hasPrevious"
      (click)="previousPage()"
    >
      Previous
    </button>


    <span class="page-indicator">
      Page {{ result.page }} of {{ result.totalPages }}
    </span>


    <button
      type="button"
      class="btn btn-dark btn-sm"
      [disabled]="loading() || !result.hasNext"
      (click)="nextPage()"
    >
      Next
    </button>

  </div>

}
